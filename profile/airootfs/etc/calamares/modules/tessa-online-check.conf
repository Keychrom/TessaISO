# The installer is online-only. Fail before partitioning if the live
# environment cannot reach the Arch Linux website.
dontChroot: true
timeout: 30
script:
  - "/bin/bash -c 'curl -fsS --max-time 15 https://archlinux.org/ >/dev/null || { echo \"Tessa Linux requires an internet connection to install.\"; exit 1; }'"
