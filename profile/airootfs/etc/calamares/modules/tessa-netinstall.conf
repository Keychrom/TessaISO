# The ISO is online-only: install the target from the Arch mirrors with
# pacstrap. Calamares mounts the target before this job and expands ${ROOT}.
# The locally bundled tessa-iso package is served from the ISO's file:// repo.
dontChroot: true
timeout: 3600
verbose: true
script:
  - "/bin/bash /usr/share/tessa-installer/install-target.sh ${ROOT}"
i18n:
  name: "Installing Tessa Linux from the network"
